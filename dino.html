<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DINO UFO - Space Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d17;
            font-family: 'Press Start 2P', 'Noto Sans KR', monospace;
            color: #e8eaed;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0d17;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .pixel-btn {
            background-color: #161b2e;
            color: #f8fafc;
            border: 3px solid #64748b;
            box-shadow: 4px 4px 0px #020617;
            transition: transform 0.05s, box-shadow 0.05s, border-color 0.1s;
            cursor: pointer;
            font-family: 'Noto Sans KR', 'Press Start 2P', sans-serif;
            font-weight: 900;
        }
        .pixel-btn:hover {
            border-color: #38bdf8;
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #020617;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Main Pixel Game Canvas -->
        <canvas id="gameCanvas"></canvas>
        <!-- Ending Overlay -->
        <div id="endingOverlay" class="fixed inset-0 z-40 flex items-center justify-center bg-black pointer-events-none"
             style="opacity:0; transition: opacity 3s ease;">
            <div id="endingText" class="text-center px-6 font-sans leading-9 text-white text-sm sm:text-lg"
                 style="opacity:0; transition: opacity 1.5s ease;">
                <div>애타게 찾던 엄마 다이노와 함께</div>
                <div>집으로 무사히 돌아갔습니다... happy end!</div>
                <div class="mt-6 text-[#38bdf8] tracking-widest">- E N D -</div>
                <div class="mt-8 text-[11px] text-[#94a3b8]">터치로 다시 시작</div>
            </div>
        </div>
        <!-- Top-Right Pixel Speaker Icon Button -->
        <div class="fixed top-2.5 right-3 z-30 flex items-center gap-2">
            <button id="soundBtn" aria-label="효과음 켜기/끄기" title="효과음 켜기/끄기" class="pixel-btn w-9 h-9 p-1.5 flex items-center justify-center rounded-sm border-[#38bdf8]">
                <svg id="speakerIconSvg" viewBox="0 0 16 16" class="w-5 h-5" shape-rendering="crispEdges">
                    <!-- Speaker cone -->
                    <rect x="2" y="6" width="3" height="4" fill="#38bdf8"/>
                    <rect x="5" y="5" width="2" height="6" fill="#38bdf8"/>
                    <rect x="7" y="3" width="2" height="10" fill="#38bdf8"/>
                    <!-- Sound waves (shown when ON) -->
                    <g id="speakerWaves">
                        <rect x="10" y="6" width="1" height="4" fill="#bae6fd"/>
                        <rect x="12" y="4" width="1" height="8" fill="#38bdf8"/>
                        <rect x="14" y="5" width="1" height="6" fill="#bae6fd"/>
                    </g>
                    <!-- Diagonal Slash (shown when OFF) -->
                    <g id="speakerSlash" class="hidden">
                        <rect x="2" y="2" width="2" height="2" fill="#ff2a2a"/>
                        <rect x="4" y="4" width="2" height="2" fill="#ff2a2a"/>
                        <rect x="6" y="6" width="2" height="2" fill="#ff2a2a"/>
                        <rect x="8" y="8" width="2" height="2" fill="#ff2a2a"/>
                        <rect x="10" y="10" width="2" height="2" fill="#ff2a2a"/>
                        <rect x="12" y="12" width="2" height="2" fill="#ff2a2a"/>

                </svg>
            </button>
        </div>

        <!-- Start / Title Overlay -->
<div id="startOverlay" class="fixed inset-0 z-20 flex flex-col items-center justify-center pointer-events-none px-0 text-center">
<div class="bg-[#111629]/95 p-5 sm:p-7 border-4 border-[#38bdf8] shadow-[6px_6px_0px_#020617] max-w-2xl w-full pointer-events-auto">
                <div class="text-[11px] sm:text-xs tracking-widest mb-1 text-[#38bdf8] font-bold">SPACE ARCADE EDITION</div>

                    ▶ 게임 시작

            </div>

        <div id="gameOverOverlay" class="hidden fixed inset-0 z-20 flex flex-col items-center justify-center px-4 text-center bg-black/50">

                <div class="space-y-3 text-xs sm:text-sm my-5 py-3 border-y-2 border-[#334155] font-sans">

    </div>

    <script>
        /**
         * DINO UFO: SPACE RUNNER (FULL VERSION)
         * - True Multi-Touch (Independent Left Flight & Right Auto-Fire) + Simultaneous Keyboard/Mouse
         * - Permanent Deep Space Night Theme with Multi-Color Pixel Art
         * - Exact Chrome Dino Silhouette inside UFO Dome + Top Antenna Laser & Side Weapon Pods
         * - Red-Outlined Enemies & Bosses (Every 1,000 pts, HP = level * 100) with Red HP Bars
         * - 3 Metal Slug-style Floating Weapon Crates (Yellow Missile, Orange Shotgun, Lime 3-Way)
         */

        // ==========================================
        // 1. 8-BIT RETRO WEB AUDIO SYNTHESIZER
        // ==========================================
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playWeaponSound(weaponType) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                if (weaponType === 'missile') {
                    // Heavy rocket ignition sound (sawtooth + low drop)
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.18);
                    gain.gain.setValueAtTime(0.11, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (weaponType === 'shotgun') {
                    // Punchy scatter blast
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(480, now);
                    osc.frequency.exponentialRampToValueAtTime(95, now + 0.09);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (weaponType === 'spread') {
                    // Crisp twin-barrel triple beam
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1150, now);
                    osc.frequency.exponentialRampToValueAtTime(340, now + 0.1);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else {
                    // Default antenna laser
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(980, now);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.09);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                }
            }

            playPowerup() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.055;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                });
            }

            playHeal() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [587.33, 880, 1174.66];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.06;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.11, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.09);
                });
            }

            playHop() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(270, now);
                osc.frequency.exponentialRampToValueAtTime(640, now + 0.11);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.11);
            }

            playExplosion(isBig = false) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const duration = isBig ? 0.38 : 0.16;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);

                let lastVal = 0;
                for (let i = 0; i < bufferSize; i++) {
                    if (i % 6 === 0) lastVal = Math.random() * 2 - 1;
                    data[i] = lastVal;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isBig ? 380 : 780, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(isBig ? 0.18 : 0.09, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playBossWarning() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                for (let i = 0; i < 3; i++) {
                    const now = this.ctx.currentTime + i * 0.18;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.14);
                    gain.gain.setValueAtTime(0.11, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            }

            playGameOver() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [330, 293.66, 261.63, 196];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.11;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                });
            }
        }

        const audio = new RetroAudio();

        // ==========================================
        // 2. CANVAS SETUP (PERMANENT SPACE NIGHT)
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const LOGICAL_HEIGHT = 360;
        let logicalWidth = 640;
        let renderScale = 1;
        const MIN_LOGICAL_WIDTH = 560;
        let renderOffsetY = 0;
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const rect = container.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = Math.floor(rect.width * dpr);
            canvas.height = Math.floor(rect.height * dpr);

            renderScale = Math.min(canvas.height / LOGICAL_HEIGHT, canvas.width / MIN_LOGICAL_WIDTH);
            logicalWidth = canvas.width / renderScale;
            renderOffsetY = Math.max(0, (canvas.height - LOGICAL_HEIGHT * renderScale) / 2);

            ctx.imageSmoothingEnabled = false;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 3. PIXEL ART MATRICES & WEAPON DEFINITIONS
        // ==========================================
        // Exact Chrome Dino Pixel Grid (UNALTERED SILHOUETTE)
        const DINO_SPRITE = [
            "0000000011111110",
            "0000000111111111",
            "0000000110111111",
            "0000000111111111",
            "0000000111111111",
            "0000000111110000",
            "0000000111111100",
            "1000001111100000",
            "1000011111100000",
            "1100111111111000",
            "1111111111101000",
            "1111111111100000",
            "0111111111100000",
            "0011111111000000",
            "0001111110000000"
        ];

        // Red Pixel Heart (9x8)
        const HEART_FULL = [
            "011000110",
            "111101111",
            "111111111",
            "111111111",
            "011111110",
            "001111100",
            "000111000",
            "000010000"
        ];

        const HEART_EMPTY = [
            "011000110",
            "100101001",
            "100010001",
            "100000001",
            "010000010",
            "001000100",
            "000101000",
            "000010000"
        ];

        // Small Kamikaze Alien UFO (16x10)
        const ALIEN_UFO = [
            "0000001111000000",
            "0000111001110000",
            "0001111111111000",
            "0011111111111100",
            "0111111111111110",
            "1101101111011011",
            "1111111111111111",
            "0111111111111110",
            "0001100000011000",
            "0010000000000100"
        ];

        // Stationary Gunship (18x12)
        const GUNSHIP_SPRITE = [
            "000000001111110000",
            "000000111111111000",
            "000011111111111100",
            "001111110011111110",
            "111111110011111111",
            "111111111111111111",
            "111111111111111111",
            "001111111111111110",
            "000011111111111100",
            "000000111111111000",
            "000000001111110000",
            "000000000111100000"
        ];

        // Evil Fierce Dino Silhouette for Stage 5 Final Boss (16x15, angry brow & jagged fangs)
        const EVIL_DINO_SPRITE = [
            "0000000011111110",
            "0000000111111111",
            "0000000101111111",
            "0000000110111111",
            "0000000111111111",
            "0000000110101000",
            "0000000111111100",
            "1000001111100000",
            "1000011111100000",
            "1100111111111000",
            "1111111111101000",
            "1111111111100000",
            "0111111111100000",
            "0011111111000000",
            "0001111110000000"
        ];

        // Rebalanced Weapon Specs
        const WEAPONS = {
            default: {
                id: 'default',
                name: '기본 레이저',
                color: '#38bdf8',
                damage: 4,
                cooldown: 0.18,
                ammoPerPickup: Infinity
            },
            missile: {
                id: 'missile',
                name: '차르미사일',
                color: '#ffd60a',
                borderColor: '#b45309',
                damage: 16,
                cooldown: 0.34,
                ammoPerPickup: 50
            },
            shotgun: {
                id: 'shotgun',
                name: '슈퍼머신건',
                color: '#ff7b00',
                borderColor: '#9a3412',
                damage: 4,
                cooldown: 0.04, //
                ammoPerPickup: 200
            },
            spread: {
                id: 'spread',
                name: '삼발레이저',
                color: '#70e000',
                borderColor: '#3f6212',
                damage: 6, // 5 damage per bullet
                cooldown: 0.27,
                ammoPerPickup: 100
            }
        };

        function drawMatrix(matrix, x, y, pixelSize, color) {
            ctx.fillStyle = color;
            for (let r = 0; r < matrix.length; r++) {
                const row = matrix[r];
                for (let c = 0; c < row.length; c++) {
                    if (row[c] === '1') {
                        ctx.fillRect(
                            Math.round(x + c * pixelSize),
                            Math.round(y + r * pixelSize),
                            pixelSize,
                            pixelSize
                        );
                    }
                }
            }
        }

        // ==========================================
        // 4. GAME STATE & ENTITIES
        // ==========================================
        const GAME_STATE = {
            START: 'START',
            PLAYING: 'PLAYING',
            GAMEOVER: 'GAMEOVER'
        };

        let currentState = GAME_STATE.START;
        let score = 0;
        let highScore = 0;
        try { highScore = parseInt(localStorage.getItem('dino_ufo_hi_score') || '0', 10) || 0; } catch (e) {}
        let nextBossScore = 1000;
        let bossStage = 0; // 1..5
        let isInvertedMode = false; // Activated after defeating Stage 5 Final Boss
        let itemSpawnTimer = 0;
        let hmgStaggerToggle = 0;

        const CEILING_Y = 44;
        const FLOOR_Y = LOGICAL_HEIGHT - 24;
        const BASE_SCROLL_SPEED = 235;

        const player = {
            x: 56, // Positioned at ~2.3/3 ratio relative to previous 80 (plenty of forward view + rear thruster room)
            y: LOGICAL_HEIGHT / 2 - 22,
            width: 58,
            height: 46,
            vy: 0,
            gravity: 920,
            thrustAccel: -1950,
            maxFallSpeed: 360,
            maxRiseSpeed: -330,
            hopImpulse: -315,
            hearts: 3,
            maxHearts: 3,
            invincibleTimer: 0,
            weapon: 'default',
            ammo: Infinity,
            fireCooldown: 0,
            muzzleFlashTimer: 0,
            tiltAngle: 0
        };

        // True Simultaneous Input State (Multi-Touch + Keyboard + Mouse)
        const input = {
            leftTouches: new Set(),
            rightTouches: new Set(),
            leftKeys: new Set(),
            rightKeys: new Set(),
            leftMouseDown: false,
            rightMouseDown: false,
            lastLeftTapTime: 0,
            doubleTapThreshold: 265,
            touchHintAlpha: 1.0
        };

        function isLeftActive() {
            return input.leftTouches.size > 0 || input.leftKeys.size > 0 || input.leftMouseDown;
        }

        function isRightActive() {
            return input.rightTouches.size > 0 || input.rightKeys.size > 0 || input.rightMouseDown;
        }

        // World Entities
        let projectiles = [];
        let enemyProjectiles = [];
        let enemyBeams = []; // Stage 3 Boss 3-second straight laser beams
        let obstacles = [];
        let enemies = [];
        let powerups = [];
        let heartPickups = [];
        let bosses = []; // Array supports Stage 4 Dual Bosses!
        let dashWalls = []; // Post-Stage-5 Geometry Dash indestructible terrain blocks
let dashHazards = []; // 지뢰
let pendingMine = null; // 직전에 배치한 지뢰 정보 (다음 벽 위치 보정용)
        let particles = [];
        let floatingTexts = [];
        let stars = [];
        let planets = [];
        let terrainTicks = [];

        let obstacleSpawnTimer = 1.0;
        let enemySpawnTimer = 2.5;
        let lastCorridorCenterY = LOGICAL_HEIGHT / 2;
        let dashPatternStep = 0;
        let screenShakeTimer = 0;
let frameCounter = 0;
let gameOverAt = 0;
const RESTART_DELAY_MS = 700;
function tryRestart() {
    if (performance.now() - gameOverAt < RESTART_DELAY_MS) return;
    startGame();
}
let endingPhase = 0;   // 0:없음 1:엄마 등장 2:대치 3:페이드아웃 4:END
let endingTimer = 0;
const mom = { x: 0, y: 0, scale: 2.6 };

function startEnding() {
    endingPhase = 1;
    endingTimer = 0;
    dashWalls.forEach(w => spawnParticles(w.x + w.width / 2, w.y + w.height / 2, 6, '#38bdf8', 0.8));
    dashWalls = [];
    dashHazards = [];
    pendingMine = null;
    enemyProjectiles = [];
    mom.x = logicalWidth + 180;
    addFloatingText(logicalWidth / 2 - 50, LOGICAL_HEIGHT / 2 - 70, '익숙한 우주선이 보인다...', '#ffffff');
    audio.playPowerup();
}

function updateEnding(dt) {
    endingTimer += dt;
    mom.y = LOGICAL_HEIGHT / 2 + Math.sin(frameCounter * 0.05) * 5;
    if (endingPhase === 1) {
        mom.x += ((logicalWidth - 100) - mom.x) * Math.min(1, 1.8 * dt);
        if (endingTimer > 3.2) {
            endingPhase = 2; endingTimer = 0;
            audio.playBossWarning();
            addFloatingText(logicalWidth / 2 - 30, LOGICAL_HEIGHT / 2 - 90, '엄마다..!', '#fde047');
        }
    } else if (endingPhase === 2) {
        if (endingTimer > 2.5) {
            endingPhase = 3; endingTimer = 0;
            document.getElementById('endingOverlay').style.opacity = '1';
        }
    } else if (endingPhase === 3) {
        if (endingTimer > 3.2) {
            endingPhase = 4;
            document.getElementById('endingText').style.opacity = '1';
            try { localStorage.setItem('dino_ufo_hi_score', highScore.toString()); } catch (e) {}
            gameOverAt = performance.now();
            currentState = GAME_STATE.GAMEOVER; // Space/Enter로 재시작 가능
        }
    }
}

// 플레이어 UFO 그리기 함수를 재활용해 "좌우 반전 + 확대"한 엄마 UFO
function drawMomUFO() {
    const cx = mom.x, cy = mom.y;
    const saved = { x: player.x, y: player.y, inv: player.invincibleTimer,
                    w: player.weapon, m: player.muzzleFlashTimer, t: player.tiltAngle };
    player.x = cx - player.width / 2;
    player.y = cy - player.height / 2;
    player.invincibleTimer = 0; player.weapon = 'default';
    player.muzzleFlashTimer = 0; player.tiltAngle = 0;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(-mom.scale, mom.scale);   // 왼쪽을 바라보는 거대 UFO
    ctx.translate(-cx, -cy);
    drawPlayerUFODino();
    ctx.restore();

    Object.assign(player, { x: saved.x, y: saved.y, invincibleTimer: saved.inv,
                            weapon: saved.w, muzzleFlashTimer: saved.m, tiltAngle: saved.t });
}

        function triggerLeftPress() {
            if (currentState !== GAME_STATE.PLAYING) return;
            const now = performance.now();
            if (now - input.lastLeftTapTime <= input.doubleTapThreshold) {
                // Quick Double-Tap -> Crisp UFO Hop
                player.vy = player.hopImpulse;
                audio.playHop();
                spawnThrusterBurst(player.x + 28, player.y + player.height, 9);
                input.lastLeftTapTime = 0;
            } else {
                input.lastLeftTapTime = now;
            }
        }

            if (currentState !== GAME_STATE.PLAYING) return;
            if (player.fireCooldown > 0) return;

            const wSpec = WEAPONS[player.weapon] || WEAPONS.default;
            player.fireCooldown = wSpec.cooldown;
            player.muzzleFlashTimer = 0.07;

            const topAntennaX = player.x + 32;
            const topAntennaY = player.y + 1;
            const sidePodX = player.x + 48;
            const sidePodY = player.y + 30;

                    height: 7,

                    color: wSpec.color
                });

            } else if (player.weapon === 'shotgun') {

                const staggerOffsets = [-4, 2, -1, 4];

                });

        // ==========================================
        // 7. TRUE SIMULTANEOUS MULTI-TOUCH & KEYBOARD/MOUSE
        // ==========================================
        function updateTouches(e) {
            e.preventDefault();
            audio.init();

            const rect = canvas.getBoundingClientRect();
            const halfWidth = rect.width / 2;


            input.leftTouches.clear();
            input.rightTouches.clear();

            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const relX = t.clientX - rect.left;
                if (relX < halfWidth) {
                    input.leftTouches.add(t.identifier);
                } else {
                    input.rightTouches.add(t.identifier);
                }
            }

            if (e.type === 'touchstart') {
                // 엔딩 종료 후 화면 터치로 재시작
                if (currentState === GAME_STATE.GAMEOVER && endingPhase === 4) {
                    tryRestart();
                    return;
                }
                // 새로 닿은 손가락이 좌측일 때만 더블탭(홉) 판정
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].clientX - rect.left < halfWidth) {
                        triggerLeftPress();
                        break;
                    }
                }
            }
        }

        canvas.addEventListener('touchstart', updateTouches, { passive: false });
        canvas.addEventListener('touchmove', updateTouches, { passive: false });
        canvas.addEventListener('touchend', updateTouches, { passive: false });
        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            input.leftTouches.clear();
            input.rightTouches.clear();
        }, { passive: false });

        // Simultaneous Mouse & Keyboard Support
        canvas.addEventListener('mousedown', (e) => {
            audio.init();
            if (currentState !== GAME_STATE.PLAYING) return;

            const rect = canvas.getBoundingClientRect();
            const relX = e.clientX - rect.left;

            // If Space/W/Up is already held on keyboard, clicking anywhere fires weapon!
            // Otherwise left half flies and right half fires (right-click always fires).
            if (e.button === 2 || relX >= rect.width / 2 || input.leftKeys.size > 0) {
                input.rightMouseDown = true;
            } else {
                if (!input.leftMouseDown) {
                    input.leftMouseDown = true;
                    triggerLeftPress();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            input.leftMouseDown = false;
            input.rightMouseDown = false;
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        canvas.addEventListener('mousedown', () => {
            if (currentState === GAME_STATE.GAMEOVER && endingPhase === 4) tryRestart();
        });

        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
            audio.init();

            if (e.repeat) return;
            if ((currentState === GAME_STATE.START || currentState === GAME_STATE.GAMEOVER) &&
                (e.code === 'Space' || e.code === 'Enter')) {
                if (currentState === GAME_STATE.GAMEOVER) tryRestart();
                else startGame();
                return;
            }

            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
                if (!input.leftKeys.has(e.code)) {
                    input.leftKeys.add(e.code);
                    triggerLeftPress();
                }
            } else if (e.code === 'Enter' || e.code === 'KeyZ' || e.code === 'ArrowRight' || e.code === 'KeyJ') {
                input.rightKeys.add(e.code);
            }
        });

        window.addEventListener('keyup', (e) => {
            input.leftKeys.delete(e.code);
            input.rightKeys.delete(e.code);
        });

        }

        // Fair, guaranteed-navigable Geometry Dash terrain generator for Post-Boss Inverted Mode
        function spawnGeometryDashSegment() {
            const playableH = FLOOR_Y - CEILING_Y; // 292px
            // Guarantee generous traversable corridor gap (>= 116px, which is > 2.5x player height of 46px!)
            const minGap = 116;
            const maxGap = 144;
            const gapH = minGap + Math.random() * (maxGap - minGap);

            // Smoothly shift corridor center so consecutive obstacles are always reachable (zigzag / wave / step)
            const maxStep = 68;
            const deltaY = (Math.random() * 2 - 1) * maxStep;
            const minCenter = CEILING_Y + gapH / 2 + 16;
            const maxCenter = FLOOR_Y - gapH / 2 - 16;
            let centerY = lastCorridorCenterY + deltaY;
            if (centerY < minCenter) centerY = minCenter + Math.random() * 24;
            if (centerY > maxCenter) centerY = maxCenter - Math.random() * 24;
            lastCorridorCenterY = centerY;

            const topWallH = Math.max(14, Math.round(centerY - gapH / 2 - CEILING_Y));
            const botWallY = Math.round(centerY + gapH / 2);
            const botWallH = Math.max(14, FLOOR_Y - botWallY);

            const patternType = dashPatternStep % 3;
            dashPatternStep++;

            const spawnX = logicalWidth + 40;
            const wallW = patternType === 0 ? 34 : 28;

            if (patternType === 0) {
                // Zigzag narrow corridor pair (ceiling + floor pillars with wide navigable middle)
                dashWalls.push({ x: spawnX, y: CEILING_Y, width: wallW, height: topWallH });
                dashWalls.push({ x: spawnX, y: botWallY, width: wallW, height: botWallH });
            } else if (patternType === 1) {
                // Alternating ceiling / floor pillars
                if (dashPatternStep % 2 === 0) {
                    dashWalls.push({ x: spawnX, y: CEILING_Y, width: wallW, height: Math.min(playableH - minGap, topWallH + 22) });
                } else {
                    const h = Math.min(playableH - minGap, botWallH + 22);
                    dashWalls.push({ x: spawnX, y: FLOOR_Y - h, width: wallW, height: h });
                }
            } else {
                // Floating central monolith island with guaranteed top OR bottom passage (>= 116px)
                const blockH = 54;
                const placeHigh = centerY > (CEILING_Y + playableH / 2);
                const blockY = placeHigh ? (CEILING_Y + 26) : (FLOOR_Y - 26 - blockH);
                dashWalls.push({ x: spawnX, y: blockY, width: 32, height: blockH });
            }
        }

        // ==========================================
        // 9. GAME LOOP & COLLISION LOGIC
        // ==========================================
        function startGame() {
            audio.init();
            score = 0;
            nextBossScore = 1000;
            bossStage = 0;

                            b.x -= 640 * dt;
                            b.y += (b.ramTargetY - b.y) * 6 * dt;
                            if (b.x <= player.x + 12) {

                            if (b.x >= b.targetX) {

                                b.attackTimer = 1.2;
                            }

                                        const cycle = ['laser', 'hmg', 'missile', 'spread'];
                                        const chosen = cycle[b.weaponCycleIdx % cycle.length];
                                        b.weaponCycleIdx++;
                                        b.activeWeaponKind = chosen;

                                        if (chosen === 'hmg') {
                                            b.burstRemaining = 7;
                                            b.burstInterval = 0.05;
                                            b.attackTimer = 1.65;

                            spawnParticles(b.x + b.width / 2, b.y + b.height / 2, 26, '#fbbf24', 1.3);

                drawSmoothPixelCircle(px, py, p.radius, p.color, p.highlight);

                if (p.hasRing) {
                    ctx.fillStyle = p.ringColor;
                    ctx.fillRect(px - p.radius - 7, py - 1, (p.radius + 7) * 2, 2);
                }
            });

            // Space Corridor Ceiling & Floor Lines
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, CEILING_Y - 2, logicalWidth, 2);
            ctx.fillRect(0, FLOOR_Y, logicalWidth, 2);

            terrainTicks.forEach(t => {
                if (t.x < logicalWidth + 20) {
                    const ty = t.isTop ? (CEILING_Y - 2 - t.offsetY) : (FLOOR_Y + t.offsetY);
                    ctx.fillRect(Math.round(t.x), Math.round(ty), t.w, 2);
                }
            });
        }

        function drawHUD() {
            // 1. Top-Left: 3 Bright RED Pixel Hearts
            for (let i = 0; i < player.maxHearts; i++) {
                const hx = 12 + i * 23;
                const hy = 12;
                if (i < player.hearts) {
                    drawMatrix(HEART_FULL, hx, hy, 2, '#ff2a4b');
                    ctx.fillStyle = '#fda4af';
                    ctx.fillRect(hx + 2, hy + 2, 2, 2);
                } else {
                    drawMatrix(HEART_EMPTY, hx, hy, 2, '#475569');
                }
            }

            // 2. Weapon & Ammo Box next to Hearts
            const wSpec = WEAPONS[player.weapon];
            const boxX = 88;
            const boxY = 8;
            const boxW = 94;
            const boxH = 24;

            ctx.fillStyle = '#161b2e';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = wSpec.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = wSpec.color;
            if (player.weapon === 'default') {
                ctx.fillRect(boxX + 8, boxY + 10, 12, 4);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(boxX + 17, boxY + 11, 3, 2);
            } else if (player.weapon === 'missile') {
                ctx.fillRect(boxX + 7, boxY + 10, 11, 4);
                ctx.fillStyle = '#ff2a2a';
                ctx.fillRect(boxX + 18, boxY + 11, 3, 2);
            } else if (player.weapon === 'shotgun') {
                ctx.fillRect(boxX + 7, boxY + 10, 14, 4);
                ctx.fillStyle = '#fed7aa';
                ctx.fillRect(boxX + 11, boxY + 13, 5, 2);
            } else if (player.weapon === 'spread') {
                ctx.fillRect(boxX + 7, boxY + 9, 13, 2);
                ctx.fillRect(boxX + 7, boxY + 13, 13, 2);
            }

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            if (player.weapon === 'default') {
                ctx.font = 'bold 15px "Noto Sans KR", sans-serif';
                ctx.fillText('∞', boxX + 28, boxY + 17);
            } else {
                ctx.font = 'bold 10px "Press Start 2P", monospace';
                ctx.fillText(`x${player.ammo}`, boxX + 25, boxY + 17);
            }

            // 3. Top-Right (Left of compact speaker icon button): Korean Score Readout
            const hiStr = String(highScore).padStart(5, '0');
            const curStr = String(Math.floor(score)).padStart(5, '0');

            ctx.font = 'bold 11px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'right';
            const scoreRightX = Math.max(365, logicalWidth - 46);

            const hiLabel = `최고기록 ${hiStr}`;
            const curLabel = ` / 현재 점수 ${curStr}`;

            const curWidth = ctx.measureText(curLabel).width;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(curLabel, scoreRightX, 24);
            ctx.fillStyle = '#fbbf24';
            ctx.fillText(hiLabel, scoreRightX - curWidth, 24);

            // 4. Subtle Split-Screen Touch Guide at Start of Run
            if (currentState === GAME_STATE.PLAYING && input.touchHintAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = input.touchHintAlpha * 0.6;
                ctx.strokeStyle = '#38bdf8';
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(logicalWidth / 2, CEILING_Y + 6);
                ctx.lineTo(logicalWidth / 2, FLOOR_Y - 6);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#bae6fd';
                ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('[ 좌측 터치: 상승 / 2연타 홉 ]', logicalWidth * 0.25, FLOOR_Y - 10);
                ctx.fillText('[ 우측 터치: 무기 연사 ]', logicalWidth * 0.75, FLOOR_Y - 10);
                ctx.restore();
            }
        }

        function render() {
            ctx.fillStyle = '#0b0d17';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(0, renderOffsetY);
            ctx.scale(renderScale, renderScale);

            if (screenShakeTimer > 0) {
                ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
            }

            // 1. Deep Space Night Background
            drawBackground();

            // 2. Floating Weapon Crates & Heart Pickups
            powerups.forEach(drawWeaponCrate);
            heartPickups.forEach(drawHeartPickup);

            // 3. Geometry Dash Indestructible Walls (Post-Stage-5 Inverted Mode)
            dashWalls.forEach(drawDashWall);
            dashHazards.forEach(drawMine);

            // 4. Red-Outlined Enemy Meteors
            obstacles.forEach(drawEnemyMeteor);

            // 5. Red-Outlined Stage Enemy Ships
            enemies.forEach(drawStageEnemyShip);

            // 6. Red-Outlined Active Bosses (Stages 1..5)
            bosses.forEach(drawStageBoss);

            // 7. Player Projectiles
            projectiles.forEach(p => {
                const px = Math.round(p.x);
                const py = Math.round(p.y);
                if (p.kind === 'missile') {
                    ctx.fillStyle = '#ffd60a';
                    ctx.fillRect(px, py, p.width - 4, p.height);
                    ctx.fillStyle = '#ff2a2a';
                    ctx.fillRect(px + p.width - 4, py + 1, 4, p.height - 2);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(px, py, p.width, p.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(px + p.width - 4, py + 1, 3, Math.max(1, p.height - 2));
                }
            });

            // 8. Enemy & Evil Dino Projectiles (Reddish filter / sparkling pixels)
            enemyProjectiles.forEach(ep => {
                const ex = Math.round(ep.x);
                const ey = Math.round(ep.y);
                const twinkle = Math.floor(ep.sparklePhase) % 2 === 0;

                if (ep.kind === 'evil_laser') {
                    // Reddish-tinted player laser
                    ctx.fillStyle = '#ff2a2a';
                    ctx.fillRect(ex - 1, ey - 1, ep.width + 2, ep.height + 2);
                    ctx.fillStyle = '#fda4af';
                    ctx.fillRect(ex, ey, ep.width, ep.height);
                } else if (ep.kind === 'evil_hmg') {
                    // Reddish-tinted Heavy Machine Gun round
                    ctx.fillStyle = '#ff2a2a';
                    ctx.fillRect(ex - 1, ey - 1, ep.width + 2, ep.height + 2);
                    ctx.fillStyle = '#fdba74';
                    ctx.fillRect(ex, ey, ep.width, ep.height);
                } else if (ep.kind === 'evil_missile' || ep.kind === 'boss_missile') {
                    // Reddish-tinted missile
                    ctx.fillStyle = '#ff2a2a';
                    ctx.fillRect(ex - 1, ey - 1, ep.width + 2, ep.height + 2);
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(ex + 4, ey, ep.width - 4, ep.height);
                } else if (ep.kind === 'evil_spread') {
                    // Reddish-tinted 3-way beam
                    ctx.fillStyle = '#ff2a2a';
                    ctx.fillRect(ex - 1, ey - 1, ep.width + 2, ep.height + 2);
                    ctx.fillStyle = '#bef264';
                    ctx.fillRect(ex, ey, ep.width, ep.height);
                } else if (ep.kind === 'homing_fast') {
                    // Fast homing projectile from Stage 3+ Gunship 2
                    ctx.fillStyle = '#ff2a2a';
                    ctx.fillRect(ex - 1, ey - 1, ep.width + 2, ep.height + 2);
                    ctx.fillStyle = twinkle ? '#fde047' : '#ffffff';
                    ctx.fillRect(ex, ey + 1, ep.width, ep.height - 2);
                } else {
                    // Sparkling pixel shot
                    ctx.fillStyle = twinkle ? '#ff2a2a' : '#fde047';
                    ctx.fillRect(ex - 2, ey + 2, ep.width + 4, ep.height - 4);
                    ctx.fillRect(ex + 2, ey - 2, ep.width - 4, ep.height + 4);
                    ctx.fillStyle = twinkle ? '#ffffff' : '#ff2a2a';
                    ctx.fillRect(ex + 1, ey + 1, ep.width - 2, ep.height - 2);
                }
            });
if (endingPhase > 0) drawMomUFO();
            // 9. Player Dino UFO
            drawPlayerUFODino();

            // 10. Pixel Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
            });

            // 11. Floating Pick-up / Stage Notifications
            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
            });

            // 12. Top HUD
            drawHUD();

            ctx.restore();

            // Post-Stage-5 Final Boss Victory: Full Screen Pixel Color Inversion!
            if (isInvertedMode && currentState === GAME_STATE.PLAYING) {
                ctx.save();
                ctx.globalCompositeOperation = 'difference';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
        }

        // ==========================================
        // 11. MAIN ANIMATION LOOP & UI CONTROLS
        // ==========================================
        let lastTimestamp = 0;
        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
            lastTimestamp = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('retryBtn').addEventListener('click', tryRestart);

        const soundBtn = document.getElementById('soundBtn');
        const speakerWaves = document.getElementById('speakerWaves');
        const speakerSlash = document.getElementById('speakerSlash');
        soundBtn.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            if (audio.enabled) {
                soundBtn.classList.remove('border-[#64748b]', 'opacity-70');
                soundBtn.classList.add('border-[#38bdf8]');
                speakerWaves.classList.remove('hidden');
                speakerSlash.classList.add('hidden');
                audio.init();
            } else {
                soundBtn.classList.remove('border-[#38bdf8]');
                soundBtn.classList.add('border-[#64748b]', 'opacity-70');
                speakerWaves.classList.add('hidden');
                speakerSlash.classList.remove('hidden');
            }
        });
        function releaseAllInputs() {
            input.leftTouches.clear();
            input.rightTouches.clear();
            input.leftKeys.clear();
            input.rightKeys.clear();
            input.leftMouseDown = false;
            input.rightMouseDown = false;
        }
        document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllInputs(); });
        window.addEventListener('blur', releaseAllInputs);
        // ===== 지뢰 생성 =====
        function spawnMine() {
            if (Math.random() > 0.65) return; // 벽 세트의 65%에만 지뢰 등장
            const size = 24;
            const mineX = logicalWidth + 44;
            const halfGap = 58; // 통로 최소 높이(116)의 절반
            const topY = lastCorridorCenterY - halfGap + 4;
            const botY = lastCorridorCenterY + halfGap - 4 - size;
            const order = Math.random() < 0.5 ? [topY, botY] : [botY, topY];

            for (const y of order) {
                const mine = {
                    x: mineX,
                    y: y,
                    width: size,
                    height: size,
                    hp: 4,
                    maxHp: 4,
                    pulse: Math.random() * 6
                };
                // 벽과 겹치면 반대쪽에 시도, 둘 다 안 되면 생략
                if (!dashWalls.some(w => rectsOverlap(mine, w, 0))) {
                    dashHazards.push(mine);
                    return;
                }
            }
        }

        // ===== 지뢰 그리기 =====
        function drawMine(m) {
            const x = Math.round(m.x);
            const y = Math.round(m.y);
            const w = m.width;
            const h = m.height;
            const blink = Math.floor(m.pulse) % 2 === 0;

            // 가시 + 붉은 테두리
            ctx.fillStyle = '#ff2a2a';
            ctx.fillRect(x + 10, y - 4, 4, 4);
            ctx.fillRect(x + 10, y + h, 4, 4);
            ctx.fillRect(x - 4, y + 10, 4, 4);
            ctx.fillRect(x + w, y + 10, 4, 4);
            ctx.fillRect(x + 3, y, w - 6, h);
            ctx.fillRect(x, y + 3, w, h - 6);

            // 본체
            ctx.fillStyle = '#3f3f46';
            ctx.fillRect(x + 4, y + 2, w - 8, h - 4);
            ctx.fillRect(x + 2, y + 4, w - 4, h - 8);

            // 깜빡이는 중심부
            ctx.fillStyle = blink ? '#fde047' : '#ff2a2a';
            ctx.fillRect(x + 9, y + 9, 6, 6);

            drawRedHPBar(x, y + h + 5, w, m.hp, m.maxHp);
        }
        window.onload = function () {
            initBackground();
            resizeCanvas();
            updatePlayerAnchorX();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
